[project]
name = "weather"
version = "0.1.0"
description = "Syncs weather data from various sources into a PostgreSQL database."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.32.0",
  "beautifulsoup4>=4.15.0",
  "niquests>=3.21.3",
  "pydantic-settings>=2.16.3",
  "pydantic>=2.14.4",
  "pytz>=2026.6",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
