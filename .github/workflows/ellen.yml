name: ellen

on:
  push:
    branches: ["main"]
    paths:
      - "apps/ellen/**"
      - ".github/workflows/ellen.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/ellen/**"
      - ".github/workflows/ellen.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ellen
    env:
      INSIDAN_API_URL: https://example.invalid
      INSIDAN_TOKEN_URL: https://example.invalid/token
      INSIDAN_CLIENT_ID: test
      INSIDAN_CLIENT_SECRET: test
      GOOGLE_SPREADSHEET_ID: test
      GOOGLE_APPLICATION_CREDENTIALS: "{}"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run --no-sync pytest -q

  build-and-release:
    name: Build, Push, and Release
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: apps/ellen/GitVersion.yml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Google Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/ellen
          push: true
          tags: |
            europe-west1-docker.pkg.dev/bitnami-ch3rudc/docker/ellen:${{ steps.gitversion.outputs.majorMinorPatch }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ellen/${{ steps.gitversion.outputs.majorMinorPatch }}
          name: ellen ${{ steps.gitversion.outputs.majorMinorPatch }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
